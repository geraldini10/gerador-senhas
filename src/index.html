<!DOCTYPE html>
<html lang="pt-br">
<head>
    <link rel="icon" type="image/x-icon" href="./favicon.ico">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de senhas</title>
<style>body {
        font-family: Arial, sans-serif;
        display: flex;
        justify-content: center;
        align-items: center;
        min-height: 100vh;
        margin: 0;
        background-color: #f0f0f0;
    }

    .container {
        background-color: white;
        padding: 2rem;
        border-radius: 12px;
        width: 350px;
    }

    h1 {
        font-size: 22px;
        margin-bottom: 1.5rem;
    }
    input[type="number"] {
    width: 100%;
    padding: 8px;
    margin-top: 4px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-size: 15px;
    box-sizing: border-box;
}

.checkbox-item {
    display: flex;
    align-items: center;
    gap: 8px;
    margin: 8px 0;
}

button {
    width: 100%;
    padding: 10px;
    background-color: #534AB7;
    color: white;
    border: none;
    border-radius: 8px;
    font-size: 15px;
    cursor: pointer;
    margin-top: 1rem;
}

button:hover {
    background-color: #3C3489;
}

#resultado {
    font-family: monospace;
    font-size: 18px;
    letter-spacing: 2px;
    background: #f0f0f0;
    padding: 10px;
    border-radius: 8px;
    word-break: break-all;
}
    </style>
</head>
<body>
    <div class="container">
        <h1>Gerador de senhas</h1>
    <label>Tamanho da senha:</label>
        <input type="number" id="tamanho" value="16" min="6" max="32">
    
        <br><br>

        <div>
        <div class="checkbox-item">
        <input type="checkbox" id="maiusculas" checked>
        <label>Maiúsculas (A-Z)</label>
    </div>
    <div class="checkbox-item">
        <input type="checkbox" id="minusculas" checked>
        <label>Minúsculas (a-z)</label>
    </div>    
    <div class="checkbox-item">
        <input type="checkbox" id="numeros" checked>
        <label>Números (0-9)</label>
    </div>
    <div class="checkbox-item">
        <input type="checkbox" id="simbolos">
        <label>Símbolos (!@#$...)</label>
    </div>

        <button onclick="gerarSenha()">Gerar Senha</button>
        <br><br>
    <p>Senha gerada:</p>
    <p id="resultado">—</p>
    <button onclick="copiarSenha()">Copiar Senha</button>
    </div>
    <script>
    function gerarSenha() {
        const tamanho = document.getElementById("tamanho").value;
        const usarMaiusculas = document.getElementById("maiusculas").checked;
        const usarMinusculas = document.getElementById("minusculas").checked;
        const usarNumeros = document.getElementById("numeros").checked;
        const usarSimbolos = document.getElementById("simbolos").checked;

        let caracteres = "";
        if (usarMaiusculas) caracteres += "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
        if (usarMinusculas) caracteres += "abcdefghijklmnopqrstuvwxyz";
        if (usarNumeros)    caracteres += "0123456789";
        if (usarSimbolos)   caracteres += "!@#$%&*()-_=+?";

        if (caracteres === "") {
            alert("Selecione ao menos um tipo de caractere!");
            return;
        }

        let senha = "";
        for (let i = 0; i < tamanho; i++) {
            const indice = Math.floor(Math.random() * caracteres.length);
            senha += caracteres[indice];
        }
        document.getElementById("resultado").textContent = senha;
    }
    function copiarSenha() {
        const senha = document.getElementById("resultado").textContent;
        if (senha === "—") {
            alert("Gere uma senha primeiro!");
            return;
        }
        navigator.clipboard.writeText(senha);
        alert("Senha copiada!");
    }

</script>

</body>
</html>
